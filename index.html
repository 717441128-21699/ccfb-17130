<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蜂眸 HiveROI · 巢门录像 ROI 压缩工作台</title>
    <meta name="description" content="静动背景分离、蜜蜂/花粉块码率加权、总码率闭环、帧级随机访问与并排质量对比的巢门高速录像压缩工具" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="30" height="30">
              <path d="M16 2l12 7v14l-12 7L4 23V9z" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <ellipse cx="16" cy="17" rx="5.2" ry="3.4" fill="currentColor" opacity=".9"/>
              <path d="M11 16c-3-1-5 .4-5 2.2 0 1.6 2 2.2 4.2 1.2M21 16c3-1 5 .4 5 2.2 0 1.6-2 2.2-4.2 1.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
              <circle cx="16" cy="12.6" r="2.4" fill="currentColor"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>蜂眸 <span>HiveROI Codec</span></h1>
            <p>巢门高速录像 · 背景分离 / 花粉运动加权 / 码率闭环 / 秒级随机访问</p>
          </div>
        </div>
        <div class="topbar-meta">
          <span id="wasm-status" class="status-pill status-loading">WASM 核心加载中…</span>
          <span class="status-pill subtle" id="core-version">HCV1</span>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="工作流">
        <button class="tab active" data-tab="import" role="tab">① 录像导入</button>
        <button class="tab" data-tab="motion" role="tab">② 运动区域</button>
        <button class="tab" data-tab="bitrate" role="tab">③ 码率分配</button>
        <button class="tab" data-tab="compare" role="tab">④ 并排对比 / 导出</button>
      </nav>

      <main id="view" class="view"></main>

      <footer class="footer">
        <span>编码/解码核心：Rust → WebAssembly（HCV1 · 8×8 DCT · YCbCr 4:2:0）</span>
        <span>分块运动分析：Web Worker · 16×16 宏块</span>
        <span id="footer-spec"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
